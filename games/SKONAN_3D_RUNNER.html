
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>SKONAN 3D RUNNER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b18;color:white;font-family:Arial;text-align:center}
header{padding:14px}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff;margin:8px}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#00eaff;font-weight:bold}
canvas{width:min(96vw,700px);height:auto;background:#101a35;border:2px solid #00eaff;border-radius:14px;display:block;margin:10px auto;touch-action:none}
button{padding:13px 20px;margin:5px;border:0;border-radius:9px;background:linear-gradient(90deg,#00eaff,#8b5cf6);font-weight:bold;color:#06101c;cursor:pointer}
.controls{margin:8px}
footer{color:#8291b2;padding:12px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚀 SKONAN 3D RUNNER</h1>
<p>DODGE • COLLECT • SURVIVE</p>
<div class="stats">
<span id="score">Score: 0</span>
<span id="highScore">🏆 Best: 0</span>
<span id="coins">Coins: 0</span>
<span id="level">Level: 1</span>
<span id="lives">Shield: OFF</span>
</div>
</header>

<canvas id="game" width="700" height="450"></canvas>

<div>
<button id="start">START GAME</button>
<button id="restart">RESTART</button>
<button id="sound">SOUND: ON</button>
</div>
<div class="controls">
<button id="left">⬅ LEFT</button>
<button id="jump">⬆ JUMP</button>
<button id="right">RIGHT ➡</button>
</div>
<footer>Keyboard: ← → to move, SPACE to jump. Collect coins and avoid obstacles.</footer>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=700,H=450;

let player={lane:0,jump:0,vy:0};
let objects=[];
let score=0,coins=0,level=1;
const worlds=[
 {name:"NEON CITY",bg:"#080d1e",road:"#101b3a",light:"#00eaff"},
 {name:"CYBER HIGHWAY",bg:"#071522",road:"#102c42",light:"#00ff99"},
 {name:"LAVA ZONE",bg:"#200909",road:"#401515",light:"#ff642e"},
 {name:"ALIEN WORLD",bg:"#160b2b",road:"#281447",light:"#c084fc"},
 {name:"SPACE STATION",bg:"#050817",road:"#17203b",light:"#ffffff"}
];
let highScore=Number(localStorage.getItem("skonanRunnerHighScore"))||0;
let running=false,over=false;
let shield=0,shieldTimer=0;
let speed=3,spawnTimer=0,frame=0;
let soundOn=true;
let keys={left:false,right:false};
let audio;

const lanes=[-1,0,1];
const $=id=>document.getElementById(id);

function beep(freq=500,duration=.08){
 if(!soundOn)return;
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.frequency.value=freq;
  g.gain.value=.04;
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function road(){
 const world=worlds[Math.min(level-1,4)];
 ctx.fillStyle=world.bg;
 ctx.fillRect(0,0,W,H);

 // distant skyline
 for(let i=0;i<18;i++){
  let x=i*45;
  let height=35+(i*37%70);
  ctx.fillStyle=world.road;
  ctx.fillRect(x,105-height,30,height);
  ctx.fillStyle=world.light;
  for(let y=110-height;y<100;y+=15)ctx.fillRect(x+7,y,3,4);
 }

 // perspective road
 ctx.fillStyle=world.road;
 ctx.beginPath();
 ctx.moveTo(265,100);ctx.lineTo(435,100);
 ctx.lineTo(650,450);ctx.lineTo(50,450);
 ctx.closePath();ctx.fill();

 ctx.strokeStyle=world.light;
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(265,100);ctx.lineTo(50,450);
 ctx.moveTo(435,100);ctx.lineTo(650,450);
 ctx.stroke();

 // moving lane markings
 for(let i=0;i<9;i++){
  let t=(i/9+(frame*speed/1300))%1;
  let y=100+t*t*350;
  let width=2+t*4;
  let center=350;
  ctx.strokeStyle="#7388bb";
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(center-width*2,y);
  ctx.lineTo(center+width*2,y);
  ctx.stroke();
 }
 // Current world name
 ctx.textAlign="center";
 ctx.fillStyle=world.light;
 ctx.font="bold 18px Arial";
 ctx.fillText(world.name,350,35);
}

function laneX(lane,y){
 let t=(y-100)/350;
 return 350+lane*(25+t*95);
}
function drawPlayer(){
 let x=laneX(player.lane,365);
 let y=365-player.jump;

 // Running animation
 let swing=Math.sin(frame*.22)*8;
 let armSwing=Math.sin(frame*.22)*10;

 // Ground shadow
 ctx.fillStyle="rgba(0,0,0,.45)";
 ctx.beginPath();
 ctx.ellipse(x,392,25,8,0,0,Math.PI*2);
 ctx.fill();

 // Back leg
 ctx.strokeStyle="#202b3d";
 ctx.lineWidth=10;
 ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(x+5,y+18);
 ctx.lineTo(x+11-swing,y+42);
 ctx.stroke();

 // Front leg
 ctx.beginPath();
 ctx.moveTo(x-5,y+18);
 ctx.lineTo(x-12+swing,y+42);
 ctx.stroke();

 // Shoes
 ctx.fillStyle="#101827";
 ctx.beginPath();
 ctx.roundRect(x-22+swing,y+38,16,7,4);
 ctx.roundRect(x+7-swing,y+38,17,7,4);
 ctx.fill();

 // Shoe neon soles
 ctx.fillStyle="#00eaff";
 ctx.fillRect(x-21+swing,y+44,15,2);
 ctx.fillRect(x+8-swing,y+44,16,2);

 // Back arm
 ctx.strokeStyle="#b97855";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(x+12,y-5);
 ctx.lineTo(x+22-armSwing,y+14);
 ctx.stroke();

 // Front arm
 ctx.beginPath();
 ctx.moveTo(x-12,y-5);
 ctx.lineTo(x-22+armSwing,y+14);
 ctx.stroke();

 // Hands
 ctx.fillStyle="#d99a76";
 ctx.beginPath();
 ctx.arc(x+22-armSwing,y+16,5,0,Math.PI*2);
 ctx.arc(x-22+armSwing,y+16,5,0,Math.PI*2);
 ctx.fill();

 // Torso / jacket
 ctx.fillStyle="#172b48";
 ctx.beginPath();
 ctx.roundRect(x-16,y-18,32,38,7);
 ctx.fill();

 // Jacket outline
 ctx.strokeStyle="#00eaff";
 ctx.lineWidth=2;
 ctx.stroke();

 // Jacket center zipper
 ctx.fillStyle="#00eaff";
 ctx.fillRect(x-1,y-16,2,31);

 // Shoulder panels
 ctx.fillStyle="#244c73";
 ctx.fillRect(x-16,y-15,8,9);
 ctx.fillRect(x+8,y-15,8,9);

 // Chest emblem
 ctx.fillStyle="#8b5cf6";
 ctx.beginPath();
 ctx.arc(x,y-3,4,0,Math.PI*2);
 ctx.fill();

 // Neck
 ctx.fillStyle="#d99a76";
 ctx.fillRect(x-5,y-25,10,10);

 // Head
 ctx.fillStyle="#d99a76";
 ctx.beginPath();
 ctx.arc(x,y-36,14,0,Math.PI*2);
 ctx.fill();

 // Ears
 ctx.beginPath();
 ctx.arc(x-14,y-36,3,0,Math.PI*2);
 ctx.arc(x+14,y-36,3,0,Math.PI*2);
 ctx.fill();

 // Hair
 ctx.fillStyle="#111827";
 ctx.beginPath();
 ctx.arc(x,y-41,14,Math.PI,Math.PI*2);
 ctx.fill();

 // Hair sides
 ctx.fillRect(x-13,y-43,5,10);
 ctx.fillRect(x+8,y-43,5,10);

 // Eyebrows
 ctx.strokeStyle="#542f25";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x-8,y-38);
 ctx.lineTo(x-3,y-39);
 ctx.moveTo(x+3,y-39);
 ctx.lineTo(x+8,y-38);
 ctx.stroke();

 // Eyes
 ctx.fillStyle="#111827";
 ctx.beginPath();
 ctx.arc(x-5,y-35,1.8,0,Math.PI*2);
 ctx.arc(x+5,y-35,1.8,0,Math.PI*2);
 ctx.fill();

 // Nose
 ctx.strokeStyle="#a65f45";
 ctx.lineWidth=1.5;
 ctx.beginPath();
 ctx.moveTo(x,y-34);
 ctx.lineTo(x-1,y-29);
 ctx.lineTo(x+2,y-29);
 ctx.stroke();

 // Mouth
 ctx.beginPath();
 ctx.moveTo(x-4,y-25);
 ctx.quadraticCurveTo(x,y-23,x+4,y-25);
 ctx.stroke();

 // Futuristic visor
 ctx.strokeStyle="#00eaff";
 ctx.lineWidth=2;
 ctx.fillStyle="rgba(0,234,255,.12)";
 ctx.beginPath();
 ctx.roundRect(x-12,y-39,24,9,4);
 ctx.fill();
 ctx.stroke();

 // Neck collar
 ctx.strokeStyle="#8b5cf6";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(x,y-22,7,0,Math.PI);
 ctx.stroke();

 // Shield
 if(shield>0){
  ctx.strokeStyle="#a855f7";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(x,y-10,43,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle="rgba(168,85,247,.08)";
  ctx.beginPath();
  ctx.arc(x,y-10,43,0,Math.PI*2);
  ctx.fill();
 }
}



function drawObject(o){
 let x=laneX(o.lane,o.y);
 let t=(o.y-100)/350;
 let size=12+t*27;

 if(o.type==="coin"){
  ctx.fillStyle="#ffd700";
  ctx.beginPath();ctx.arc(x,o.y,size*.55,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff4a0";ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle="#805600";ctx.font=`bold ${size}px Arial`;
  ctx.textAlign="center";ctx.fillText("$",x,o.y+size*.3);
 }else if(o.type==="shield"){
  ctx.fillStyle="#9b5cff";
  ctx.beginPath();
  ctx.moveTo(x,o.y-size);ctx.lineTo(x+size,o.y);
  ctx.lineTo(x,o.y+size);ctx.lineTo(x-size,o.y);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="white";ctx.font="bold 15px Arial";
  ctx.textAlign="center";ctx.fillText("S",x,o.y+5);
 }else{
  ctx.fillStyle="#ff315d";
  ctx.fillRect(x-size,o.y-size,size*2,size*2);
  ctx.strokeStyle="#ffb1c2";ctx.lineWidth=3;
  ctx.strokeRect(x-size,o.y-size,size*2,size*2);
 }
}

function spawn(){
 let lane=lanes[Math.floor(Math.random()*3)];
 let r=Math.random();
 let type=r<.57?"obstacle":r<.94?"coin":"shield";
 objects.push({lane,y:110,type});
}

function update(){
 if(!running)return;
 frame++;
 score+=1;
 level=1+Math.floor(score/500);
 speed=3+level*.45;

 if(keys.left){player.lane=Math.max(-1,player.lane-1);keys.left=false;beep(300)}
 if(keys.right){player.lane=Math.min(1,player.lane+1);keys.right=false;beep(400)}

 player.jump+=player.vy;
 if(player.jump>0){player.vy-=.8}
 else{player.jump=0;player.vy=0}

 if(shieldTimer>0){shieldTimer--;if(shieldTimer===0)shield=0}

 spawnTimer++;
 if(spawnTimer>Math.max(24,75-level*4)){
  spawn();spawnTimer=0;
 }

 for(let o of objects)o.y+=speed;

 objects=objects.filter(o=>{
  if(o.y>330&&o.y<410&&o.lane===player.lane){
   if(o.type==="coin"){
    coins++;beep(850);return false;
   }
   if(o.type==="shield"){
    shield=1;shieldTimer=450;beep(1000);return false;
   }
   if(o.type==="obstacle"){
    if(shield){shield=0;shieldTimer=0;beep(180);return false}
    endGame();return false;
   }
  }
  return o.y<470;
 });

 $("score").textContent="Score: "+score;
 $("highScore").textContent="🏆 Best: "+highScore;
 $("coins").textContent="Coins: "+coins;
 $("level").textContent="Level: "+level;
 $("lives").textContent=shield?"Shield: ON":"Shield: OFF";
}

function endGame(){
 running=false;
 over=true;
 beep(120,.3);

 if(score>highScore){
   highScore=score;
   localStorage.setItem("skonanRunnerHighScore",highScore);
 }
}
function draw(){
 road();
 objects.forEach(drawObject);
 drawPlayer();

 if(!running){
  ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle=over?"#ff315d":"#00eaff";
  ctx.font="bold 36px Arial";
  ctx.fillText(over?"GAME OVER":"READY TO RUN",350,200);
  ctx.fillStyle="white";ctx.font="18px Arial";
  ctx.fillText(over?"Press RESTART to try again":"Press START GAME to begin",350,240);
 }
}

function loop(){
 update();draw();requestAnimationFrame(loop);
}

function start(){
 if(over)return;
 running=true;beep(600);
}
function restart(){
 player={lane:0,jump:0,vy:0};
 objects=[];score=0;coins=0;level=1;
 shield=0;shieldTimer=0;speed=3;
 frame=0;spawnTimer=0;over=false;running=true;

 $("score").textContent="Score: "+score;
 $("highScore").textContent="🏆 Best: "+highScore;
 $("coins").textContent="Coins: "+coins;
 $("level").textContent="Level: "+level;
 $("lives").textContent="Shield: OFF";

 beep(650);
}

function jump(){
 if(player.jump===0){
  player.vy=13;beep(700);
 }
}

$("start").onclick=start;
$("restart").onclick=restart;
$("jump").onclick=jump;
$("sound").onclick=()=>{
 soundOn=!soundOn;
 $("sound").textContent="SOUND: "+(soundOn?"ON":"OFF");
};

$("left").onpointerdown=()=>keys.left=true;
$("right").onpointerdown=()=>keys.right=true;

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
 if(e.code==="Space")jump();
});

$("left").addEventListener("pointerup",()=>keys.left=false);
$("right").addEventListener("pointerup",()=>keys.right=false);

$("highScore").textContent="🏆 Best: "+highScore;
loop();
</script>
</body>
</html>
